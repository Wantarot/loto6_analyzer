name: Loto6 Auto Update & Prediction

on:
  schedule:
    # 毎週月曜・木曜 日本時間 21:30 (UTC 12:30)
    - cron: "30 12 * * 1,4"
  workflow_dispatch:
    inputs:
      pool_size:
        description: "上位プール数字数 (8〜15)"
        required: false
        default: "12"
      n_tickets:
        description: "ホイーリング生成口数 (1〜10)"
        required: false
        default: "5"
      lgbm_weight:
        description: "LightGBMブレンド比率 (0.0〜1.0)"
        required: false
        default: "0.50"

permissions:
  contents: write

jobs:
  run-loto6-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Loto6 auto update, grading & prediction
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
        run: |
          POOL_SIZE="${{ github.event.inputs.pool_size || '12' }}"
          N_TICKETS="${{ github.event.inputs.n_tickets || '5' }}"
          LGBM_WEIGHT="${{ github.event.inputs.lgbm_weight || '0.50' }}"
          python -m src.auto_run \
            --pool-size "${POOL_SIZE}" \
            --n-tickets "${N_TICKETS}" \
            --lgbm-weight "${LGBM_WEIGHT}"

      - name: Commit and push updated data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/loto6_history.csv data/latest_prediction.json data/latest_report.md
          if [ -f data/prediction_log.csv ]; then
            git add data/prediction_log.csv
          fi

          if git diff --staged --quiet; then
            echo "No changes in data/ to commit."
          else
            TIMESTAMP_JST="$(TZ='Asia/Tokyo' date '+%Y-%m-%d %H:%M JST')"
            git commit -m "chore(data): auto-update Loto6 history & prediction (${TIMESTAMP_JST})"
            git push
          fi
